name: sandbox-mysql

services:
  db:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sandbox}
      MYSQL_USER: ${MYSQL_USER:-sandbox}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sandbox}
    volumes:
      - db-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  mysql:
    name: sandbox-mysql-net

volumes:
  db-data:
